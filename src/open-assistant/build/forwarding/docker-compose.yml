services:
  open-assistant:
    networks:
      - open-assistant-network
    ports:
      - 80:80
  open-assistant-api:
    networks:
      - open-assistant-network
  open-assistant-worker:
    networks:
      - open-assistant-network
  open-assistant-playground-ui:
    networks:
      - open-assistant-network
  open-assistant-db:
    networks:
      - open-assistant-network
    ports:
      - 3306:3306
  open-assistant-redis:
    networks:
      - open-assistant-network
    ports:
      - 6379:6379
  open-assistant-minio:
    networks:
      - open-assistant-network
    ports:
      - 9001:9001
      - 9000:9000
networks:
  open-assistant-network:
    name: open-assistant-network
