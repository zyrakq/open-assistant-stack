x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

x-common: &common
    restart: unless-stopped
    logging: *default-logging

x-backend: &backend
  image: samepaage/open-assistant-api:main
  depends_on:
    - open-assistant-db
    - open-assistant-redis
    - open-assistant-minio

x-app-environment: &app-env
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_ENV: ${APP_ENV:-prod}
  APP_AUTH_ENABLE: ${APP_AUTH_ENABLE:-false}
  APP_AUTH_ADMIN_TOKEN: ${APP_AUTH_ADMIN_TOKEN:-admin}
  APP_AES_ENCRYPTION_KEY: ${APP_AES_ENCRYPTION_KEY}
  FILE_SERVICE_MODULE: ${FILE_SERVICE_MODULE:-app.services.file.impl.oss_file.OSSFileService}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-database-environment: &database-env
  DB_HOST: ${DB_HOST:-open-assistant-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-open_assistant}
  DB_USER: ${DB_USER:-open_assistant}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}

x-redis-environment: &redis-env
  REDIS_HOST: ${REDIS_HOST:-open-assistant-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1}

x-s3-environment: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://open-assistant-minio:9000}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-oas}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}

services:
  open-assistant:
    <<: *common
    depends_on:
      - open-assistant-api
      - open-assistant-playground-ui

  open-assistant-api:
    <<: [*common, *backend]
    container_name: open-assistant-api
    hostname: api
    environment:
      <<: [*app-env, *database-env, *redis-env, *s3-env]
      MODE: api
      APP_NAME: ${ASSISTANT_API_APP_NAME:-open-assistant-api}
      APP_API_PREFIX: ${ASSISTANT_API_APP_API_PREFIX:-/api}
      APP_SERVER_WORKERS: ${ASSISTANT_WORKERS:-20}
      MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}

  open-assistant-worker:
    <<: [*common, *backend]
    container_name: open-assistant-worker
    environment:
      <<: [*app-env, *database-env, *redis-env, *s3-env]
      MODE: worker
      CELERY_WORKERS: ${ASSISTANT_WORKERS:-20}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MAX_STEP: ${LLM_MAX_STEP:-25}
      TOOL_WORKER_NUM: ${TOOL_WORKER_NUM:-10}
      TOOL_WORKER_EXECUTION_TIMEOUT: ${TOOL_WORKER_EXECUTION_TIMEOUT:-180}

  open-assistant-playground-ui:
    <<: *common
    container_name: open-assistant-playground-ui
    image: samepaage/open-assistant-playground-ui:main
    depends_on:
      - open-assistant-api

  open-assistant-db:
    <<: *common

  open-assistant-redis:
    <<: *common

  open-assistant-minio:
    <<: *common