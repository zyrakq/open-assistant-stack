services:
  open-assistant:
    networks:
      - open-assistant-network
      - step-ca-network
    environment:
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
  open-assistant-api:
    networks:
      - open-assistant-network
  open-assistant-worker:
    networks:
      - open-assistant-network
  open-assistant-playground-ui:
    networks:
      - open-assistant-network
  open-assistant-db:
    networks:
      - open-assistant-network
  open-assistant-redis:
    networks:
      - open-assistant-network
  open-assistant-minio:
    networks:
      - open-assistant-network
networks:
  open-assistant-network:
    name: open-assistant-network
  step-ca-network:
    external: true
